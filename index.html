<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>GymTracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icon.png" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>GymTracker</h1>
      <p class="subtitle">Seu progresso, todos os dias</p>
    </header>

    <nav class="tab-bar">
      <button class="tab active" data-tab="treino">Treino</button>
      <button class="tab" data-tab="historico">Histórico</button>
      <button class="tab" data-tab="perfil">Perfil</button>
    </nav>

    <main id="main-content">
      <!-- Treino Tab -->
      <section id="treino" class="tab-content active">
        <div class="card">
          <h2>Treino de Hoje</h2>
          <form id="exercise-form">
            <label for="exercise-name">Exercício</label>
            <input type="text" id="exercise-name" placeholder="Ex: Supino reto" required />

            <div class="row">
              <div class="field">
                <label for="sets">Séries</label>
                <input type="number" id="sets" min="1" placeholder="3" required />
              </div>
              <div class="field">
                <label for="reps">Repetições</label>
                <input type="number" id="reps" min="1" placeholder="12" required />
              </div>
              <div class="field">
                <label for="weight">Peso (kg)</label>
                <input type="number" id="weight" min="0" step="0.5" placeholder="60" />
              </div>
            </div>

            <button type="submit" class="btn-primary">Adicionar Exercício</button>
          </form>
        </div>

        <div class="card">
          <h2>Exercícios Adicionados</h2>
          <ul id="exercise-list" class="exercise-list"></ul>
        </div>
      </section>

      <!-- Histórico Tab -->
      <section id="historico" class="tab-content">
        <div class="card">
          <h2>Histórico Semanal</h2>
          <div id="weekly-summary" class="summary-grid"></div>
        </div>
        <div class="card">
          <h2>Treinos Anteriores</h2>
          <ul id="history-list" class="history-list"></ul>
        </div>
      </section>

      <!-- Perfil Tab -->
      <section id="perfil" class="tab-content">
        <div class="card">
          <h2>Seus Dados</h2>
          <form id="profile-form">
            <label for="user-name">Nome</label>
            <input type="text" id="user-name" placeholder="Seu nome" />

            <label for="user-weight">Peso atual (kg)</label>
            <input type="number" id="user-weight" min="0" step="0.1" placeholder="70.0" />

            <label for="user-goal">Objetivo</label>
            <select id="user-goal">
              <option value="hipertrofia">Hipertrofia</option>
              <option value="forca">Força</option>
              <option value="emagrecimento">Emagrecimento</option>
              <option value="condicionamento">Condicionamento</option>
            </select>

            <button type="submit" class="btn-primary">Salvar Perfil</button>
          </form>
        </div>
        <div class="card">
          <h2>Estatísticas</h2>
          <div id="stats-display" class="stats-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
